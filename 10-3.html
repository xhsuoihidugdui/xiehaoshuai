<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10-3 media query</title>
  <style>
    :root {
      font-size: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: "Microsoft YaHei", sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
    }

    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #4e79ff;
      transition: background 0.6s ease;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.08);
    }

    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      color: #fff;
      text-shadow: 0 0.25rem 0.75rem rgba(0, 0, 0, 0.35);
    }

    .title {
      margin: 0;
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: 0.4rem;
    }

    .subtitle {
      margin: 1rem 0 0;
      font-size: 1.5rem;
      letter-spacing: 0.2rem;
    }

    @media (max-width: 1024px) {
      .hero {
        background: #2bb673;
      }

      .title {
        font-size: 3rem;
      }

      .subtitle {
        font-size: 1.25rem;
      }
    }

    @media (max-width: 768px) {
      .hero {
        background: #ff9f43;
      }

      .title {
        font-size: 2.5rem;
        letter-spacing: 0.25rem;
      }

      .subtitle {
        font-size: 1rem;
        letter-spacing: 0.1rem;
      }
    }

    @media (max-width: 480px) {
      .hero {
        background: #ff5c7a;
      }

      .title {
        font-size: 2rem;
        letter-spacing: 0.15rem;
      }

      .subtitle {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="content">
      <h1 class="title">解浩帅</h1>
      <p class="subtitle">Viewport Responsive</p>
    </div>
  </div>
</body>
</html>
