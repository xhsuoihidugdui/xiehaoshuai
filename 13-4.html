<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iconfont SVG 图标 - 移动端底部导航</title>
    <style>
        :root {
            --xie-primary: #3498db;
            --xie-dark: #2c3e50;
            --xie-light: #ecf0f1;
            --xie-nav-bg: #ffffff;
            --xie-nav-text: #95a5a6;
            --xie-nav-active: #3498db;
            --xie-badge: #e74c3c;
            --xie-dot: #ff3b30;
            --xie-nav-height: 56px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--xie-light);
            padding-bottom: var(--xie-nav-height);
        }

        .xie-header {
            background: var(--xie-primary);
            color: #fff;
            padding: 60px 20px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .xie-header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .xie-content {
            padding: 20px;
        }

        .xie-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .xie-card h3 {
            font-size: 16px;
            color: var(--xie-dark);
            margin-bottom: 10px;
        }

        .xie-card p {
            font-size: 14px;
            color: #7f8c8d;
            line-height: 1.6;
        }

        .xie-demo-text {
            margin-top: 10px;
            display: flex;
            gap: 16px;
        }

        .xie-demo-text svg {
            width: 28px;
            height: 28px;
            color: var(--xie-primary);
        }

        .xie-bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: var(--xie-nav-height);
            background: var(--xie-nav-bg);
            display: flex;
            border-top: 1px solid #e0e0e0;
            z-index: 999;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .xie-nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            color: var(--xie-nav-text);
            text-decoration: none;
            transition: color 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .xie-nav-item.xie-active {
            color: var(--xie-nav-active);
        }

        .xie-nav-item svg {
            width: 26px;
            height: 26px;
        }

        .xie-nav-label {
            font-size: 11px;
            margin-top: 4px;
        }

        .xie-badge {
            position: absolute;
            top: 6px;
            right: calc(50% - 26px);
            min-width: 16px;
            height: 16px;
            border-radius: 8px;
            background: var(--xie-badge);
            color: #fff;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            line-height: 1;
        }

        .xie-dot {
            position: absolute;
            top: 8px;
            right: calc(50% - 22px);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--xie-dot);
        }
    </style>
</head>

    <div class="xie-header">
        <h1>iconfont SVG 图标导航</h1>
    </div>

    <div class="xie-content">
        <div class="xie-card">
            <h3>SVG 图标 (iconfont)</h3>
            <p>使用 iconfont.cn 导出的 SVG symbol 定义，通过 SVG use 元素引用图标。每个图标是独立的矢量图形，支持 CSS fill 属性控制颜色。</p>
            <div class="xie-demo-text">
                <svg><use href="#icon-shouye-zhihui"/></svg>
                <svg><use href="#icon-xiaoxi-zhihui"/></svg>
                <svg><use href="#icon-faxian"/></svg>
                <svg><use href="#icon-wode"/></svg>
            </div>
        </div>
        <div class="xie-card">
            <h3>技术特点</h3>
            <p>SVG 图标基于矢量图形，通过 symbol 定义、use 引用实现复用。相比字体图标，SVG 支持多色、渐变等更丰富的视觉效果，且不受字体加载影响。</p>
        </div>
        <div class="xie-card">
            <h3>底部导航说明</h3>
            <p>底部固定导航使用 flex:1 实现自适应宽度分配，导航项包含数字徽章（消息）和右上角红点（发现）两种状态标记。</p>
        </div>
    </div>
