<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       h2,h3,p{
           padding:0;
           margin:0;
       }
       #box h3{
           padding:8px;
           margin:20px;
           border:1px solid #ccc;
           font-size:16px;
           line-height:33px;
           text-align: center;
           color:#034;
           letter-spacing: 3px;
       }
       #box p{
           color:#666;
           text-indent:2em;
           line-height:150%;
       }
       #box a{
           color:#034;
           text-decoration:underline;
       }

       /* 要求2：h2 黑底白字 居中 行高150% */
       h2{
            background-color: black;
            color: white;
            text-align: center;
            line-height: 150%;
       }

       /* 要求1：1个选择器 bb → 学号/姓名/班级 蓝色加粗 */
       .bb{
            color: blue;
            font-weight: bold;
       }

       /* 要求3：知识点 蓝底白字 */
       .knowledge{
            background-color: blue;
            color: white;
       }
    </style>
</head>
<body>
    <h2>css群组选择器和后代选择器</h2>
    <div id="box">
        <h3>CSS进阶</h3>
        <p> 学号：<span class="bb">110</span>，姓名：<span class="bb"></span>，班级：<span class="bb">计算机24001班</span>，
            本实例的知识点：<span class="knowledge">CSS 群组选择器和后代选择器</span>。
            <a href="#">【更多】</a>
        </p>
    </div>
</body>
</html>
