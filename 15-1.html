<!DOCTYPE html>
<!-- 姓名：解浩帅，日期：2026-10-26，功能名称：数7游戏-100个盒子按规则显示 -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15-1 数7游戏 - 解浩帅</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
            background: #f4f7fb;
        }
        h2 {
            color: #12283f;
            text-align: center;
            margin-bottom: 10px;
        }
        .xhs-rule {
            text-align: center;
            color: #5a6b7c;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .xhs-boxes {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
        }
        .xhs-box {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            background: #fff;
            color: #1e6fd9;
            box-shadow: 0 2px 6px rgba(18, 40, 63, .1);
        }
        .xhs-box.empty {
            background: repeating-linear-gradient(
                45deg, #f0f0f0, #f0f0f0 4px,
                #e0e0e0 4px, #e0e0e0 8px
            );
            color: transparent;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <h2>解浩帅 · 数7游戏（1 ~ 100）</h2>
    <p class="xhs-rule">7 的倍数 或 数字中包含 7 → 空盒子，其余显示数字</p>
    <div class="xhs-boxes" id="xhsBoxes"></div>

    <script>
        const xhsBoxes = document.getElementById("xhsBoxes");
        for (let xhsNum = 1; xhsNum <= 100; xhsNum++) {
            const xhsIsMultipleOf7 = xhsNum % 7 === 0;
            const xhsHasDigit7 = String(xhsNum).indexOf("7") !== -1;
            const xhsBox = document.createElement("div");
            xhsBox.className = "xhs-box" + (xhsIsMultipleOf7 || xhsHasDigit7 ? " empty" : "");
            xhsBox.textContent = xhsIsMultipleOf7 || xhsHasDigit7 ? "" : xhsNum;
            xhsBoxes.appendChild(xhsBox);
        }
    </script>
</body>
</html>
