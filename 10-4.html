<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10-4 media query layout</title>
  <style>
    :root {
      font-size: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft YaHei", sans-serif;
      background: #f5f5f5;
    }

    .wrap {
      width: 90%;
      max-width: 1200px;
      margin: 2rem auto;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 1.5rem;
      color: #222;
    }

    .box-list {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .box {
      flex: 1 1 23%;
      min-width: 8rem;
      height: 8rem;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      border-radius: 1rem;
      font-size: 1.5rem;
      font-weight: 700;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.12);
    }

    @media (max-width: 900px) {
      .box {
        flex-basis: 31%;
      }
    }

    @media (max-width: 600px) {
      .box {
        flex-basis: 48%;
      }
    }

    @media (max-width: 320px) {
      .box {
        flex-basis: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>解浩帅</h1>
    <div class="box-list">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
      <div class="box">5</div>
      <div class="box">6</div>
      <div class="box">7</div>
      <div class="box">8</div>
    </div>
  </div>
</body>
</html>
