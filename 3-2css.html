<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial‑scale=1.0">
    <title>110 解浩帅</title>
    <style>
        /*1. h2黑底白字 */
        h2 {
            background-color: black;
            color: white;
        }
        h3 {
            color: red;
        }
        p {
            color: blue;
        }
        /*id盒子 #box */
        #box {
            width: 500px;
            height: 500px;
            background-color: #ccc;
        }
        .n1 {
            color: #7A9;
        }
        /*3. 选择器三个字白色 */
        .whiteWord {
            color: #ffffff;
        }
        /*2.名字每个字不同颜色 */
        .zi1 {
            color: red;
        }
        .zi2 {
            color: orange;
        }
        .zi3 {
            color: green;
        }
        /*4.新盒子，放学号姓名，设置宽高背景 */
        #stuBox {
            width: 450px;
            height: 180px;
            background-color: #a0c8ff;
        }
    </style>
</head>
<body>
    <h2>层叠样式表CSS</h2>
    <div id="box">
        <h3>CSS<span class="whiteWord">选择器</span></h3>
        <p>
            <span class="zi1">解</span>
            <span class="zi2">浩</span>
            <span class="zi3">帅</span>
        </p>
        <p>CSS属性</p>
    </div>
    <!-- 新增盒子 -->
    <div id="stuBox">
        24001010110
    </div>
</body>
</html>
