<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11-3 CSS3 3D 动画</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        :root{
            --xie-primary:#1e6fd9;
            --xie-accent:#f5a623;
            --xie-dark:#12283f;
            --xie-light:#f4f7fb;
            --xie-ink:#2b2b2b;
        }
        body{
            font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;
            background:var(--xie-light);
            color:var(--xie-ink);
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            padding:40px 20px;
        }
        h1{
            font-size:32px;
            color:var(--xie-dark);
            margin-bottom:8px;
        }
        .xie-subtitle{
            font-size:14px;
            color:#5a6b7c;
            margin-bottom:40px;
        }
        .xie-scene{
            width:200px;
            height:200px;
            perspective:800px;
            margin-bottom:48px;
        }
        .xie-cube{
            width:100%;
            height:100%;
            position:relative;
            transform-style:preserve-3d;
            animation:xie-spin 6s linear infinite;
        }
        .xie-face{
            position:absolute;
            width:200px;
            height:200px;
            border:2px solid var(--xie-primary);
            background:rgba(30,111,217,0.12);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:20px;
            font-weight:bold;
            color:var(--xie-primary);
            backface-visibility:visible;
        }
        .xie-face:nth-child(1){transform:rotateY(0deg) translateZ(100px);}
        .xie-face:nth-child(2){transform:rotateY(90deg) translateZ(100px);}
        .xie-face:nth-child(3){transform:rotateY(180deg) translateZ(100px);}
        .xie-face:nth-child(4){transform:rotateY(270deg) translateZ(100px);}
        .xie-face:nth-child(5){transform:rotateX(90deg) translateZ(100px);}
        .xie-face:nth-child(6){transform:rotateX(-90deg) translateZ(100px);}
        @keyframes xie-spin{
            from{transform:rotateX(0deg) rotateY(0deg);}
            to{transform:rotateX(360deg) rotateY(360deg);}
        }
        .xie-cards{
            display:flex;
            gap:24px;
            flex-wrap:wrap;
            justify-content:center;
            max-width:900px;
        }
        .xie-card{
            background:#fff;
            border-radius:14px;
            padding:28px 24px;
            width:260px;
            box-shadow:0 6px 20px rgba(18,40,63,.08);
            text-align:center;
            transition:transform .4s ease;
        }
        .xie-card:hover{
            transform:translateY(-8px) scale(1.03);
        }
        .xie-card h3{
            font-size:18px;
            color:var(--xie-dark);
            margin-bottom:10px;
        }
        .xie-card p{
            font-size:13px;
            color:#5a6b7c;
            line-height:1.6;
        }
        .xie-flip-scene{
            width:120px;
            height:120px;
            margin:0 auto 16px;
            perspective:600px;
        }
        .xie-flip{
            width:100%;
            height:100%;
            position:relative;
            transform-style:preserve-3d;
            animation:xie-flip 3s ease-in-out infinite;
        }
        .xie-flip-face{
            position:absolute;
            width:120px;
            height:120px;
            border-radius:12px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:14px;
            color:#fff;
            font-weight:bold;
        }
        .xie-flip-front{
            background:linear-gradient(135deg,var(--xie-primary),#2f8bf0);
            transform:translateZ(60px);
        }
        .xie-flip-back{
            background:linear-gradient(135deg,var(--xie-accent),#e8940a);
            transform:rotateY(180deg) translateZ(60px);
        }
        @keyframes xie-flip{
            0%,20%{transform:rotateY(0deg);}
            50%,70%{transform:rotateY(180deg);}
            100%{transform:rotateY(360deg);}
        }
        .xie-zoom-scene{
            width:120px;
            height:120px;
            margin:0 auto 16px;
            perspective:600px;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .xie-zoom-box{
            width:100px;
            height:100px;
            border-radius:12px;
            background:linear-gradient(135deg,#e74c3c,#c0392b);
            display:flex;
            align-items:center;
            justify-content:center;
            color:#fff;
            font-size:14px;
            font-weight:bold;
            animation:xie-pulse-zoom 2s ease-in-out infinite;
        }
        @keyframes xie-pulse-zoom{
            0%,100%{transform:scale(1) rotateX(0deg);}
            50%{transform:scale(1.2) rotateX(180deg);}
        }
        .xie-orbit-scene{
            width:120px;
            height:120px;
            margin:0 auto 16px;
            perspective:600px;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .xie-orbit{
            width:60px;
            height:60px;
            position:relative;
            transform-style:preserve-3d;
            animation:xie-orbit-spin 3s linear infinite;
        }
        .xie-orbit-dot{
            position:absolute;
            width:20px;
            height:20px;
            border-radius:50%;
            background:var(--xie-accent);
            box-shadow:0 0 10px rgba(245,166,35,.6);
        }
        .xie-orbit-dot:nth-child(1){transform:rotateY(0deg) translateZ(40px);}
        .xie-orbit-dot:nth-child(2){transform:rotateY(120deg) translateZ(40px);}
        .xie-orbit-dot:nth-child(3){transform:rotateY(240deg) translateZ(40px);}
        @keyframes xie-orbit-spin{
            from{transform:rotateX(70deg) rotateY(0deg);}
            to{transform:rotateX(70deg) rotateY(360deg);}
        }
        .xie-tilt-scene{
            width:120px;
            height:120px;
            margin:0 auto 16px;
            perspective:600px;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .xie-tilt{
            width:100px;
            height:100px;
            border-radius:12px;
            background:linear-gradient(135deg,#27ae60,#1e8449);
            display:flex;
            align-items:center;
            justify-content:center;
            color:#fff;
            font-size:14px;
            font-weight:bold;
            animation:xie-tilt-float 3s ease-in-out infinite;
        }
        @keyframes xie-tilt-float{
            0%,100%{transform:rotateX(20deg) rotateY(-20deg) translateY(0);}
            50%{transform:rotateX(-10deg) rotateY(20deg) translateY(-15px);}
        }
    </style>
</head>
<body>
    <h1>CSS3 3D 动画</h1>
    <p class="xie-subtitle">perspective · transform-style · rotateX / rotateY / rotateZ · preserve-3d</p>

    <div class="xie-scene">
        <div class="xie-cube">
            <div class="xie-face">前</div>
            <div class="xie-face">右</div>
            <div class="xie-face">后</div>
            <div class="xie-face">左</div>
            <div class="xie-face">上</div>
            <div class="xie-face">下</div>
        </div>
    </div>

    <div class="xie-cards">
        <div class="xie-card">
            <div class="xie-flip-scene">
                <div class="xie-flip">
                    <div class="xie-flip-face xie-flip-front">正面</div>
                    <div class="xie-flip-face xie-flip-back">背面</div>
                </div>
            </div>
            <h3>3D 翻转</h3>
            <p>使用 rotateY + preserve-3d 实现卡片正反面翻转效果</p>
        </div>
        <div class="xie-card">
            <div class="xie-zoom-scene">
                <div class="xie-zoom-box">缩放</div>
            </div>
            <h3>3D 缩放</h3>
            <p>scale 与 rotateX 组合，产生空间纵深脉冲感</p>
        </div>
        <div class="xie-card">
            <div class="xie-orbit-scene">
                <div class="xie-orbit">
                    <div class="xie-orbit-dot"></div>
                    <div class="xie-orbit-dot"></div>
                    <div class="xie-orbit-dot"></div>
                </div>
            </div>
            <h3>3D 轨道</h3>
            <p>多个球体沿 Z 轴分布，绕 Y 轴旋转形成轨道运动</p>
        </div>
        <div class="xie-card">
            <div class="xie-tilt-scene">
                <div class="xie-tilt">浮动</div>
            </div>
            <h3>3D 浮动</h3>
            <p>rotateX + rotateY + translateY 组合产生悬浮漂移效果</p>
        </div>
    </div>
</body>
</html>
