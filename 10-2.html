<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10-2 animation slideshow</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      font-family: "Microsoft YaHei", sans-serif;
    }

    .slider {
      position: relative;
      width: 760px;
      height: 500px;
      overflow: hidden;
      border-radius: 18px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      background: #000;
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: translateX(22%);
      animation: slideMove 12s ease-in-out infinite;
    }

    .slide:nth-child(2) {
      animation-delay: 4s;
    }

    .slide:nth-child(3) {
      animation-delay: 8s;
    }

    .slide img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      filter: brightness(0.9);
      animation: imgMove 12s ease-in-out infinite;
    }

    .caption {
      position: absolute;
      left: 50%;
      bottom: 34px;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      padding: 12px 28px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 4px;
      white-space: nowrap;
      opacity: 0;
      animation: textMove 12s ease-in-out infinite;
    }

    @keyframes slideMove {
      0%, 18% {
        opacity: 0;
        transform: translateX(22%);
      }
      25%, 45% {
        opacity: 1;
        transform: translateX(0);
      }
      50%, 68% {
        opacity: 1;
        transform: translateX(0);
      }
      75%, 100% {
        opacity: 0;
        transform: translateX(-22%);
      }
    }

    @keyframes imgMove {
      0%, 18% {
        transform: scale(1.12) translateX(6%);
      }
      30%, 65% {
        transform: scale(1) translateX(0);
      }
      75%, 100% {
        transform: scale(1.12) translateX(-6%);
      }
    }

    @keyframes textMove {
      0%, 20% {
        opacity: 0;
        transform: translateX(-50%) translateY(16px);
      }
      28%, 48% {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      58%, 100% {
        opacity: 0;
        transform: translateX(-50%) translateY(-10px);
      }
    }
  </style>
</head>
<body>
  <div class="slider">
    <div class="slide">
      <img src="img/1.jpg" alt="图片1" />
      <div class="caption">解浩帅</div>
    </div>

    <div class="slide">
      <img src="img/2.jpg" alt="图片2" />
      <div class="caption">解浩帅</div>
    </div>

    <div class="slide">
      <img src="img/3.jpg" alt="图片3" />
      <div class="caption">解浩帅</div>
    </div>
  </div>
</body>
</html>
